<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eggklokke</title>
<style>
  :root {
    --bg: #E3ECEF;
    --panel: #F4F8F9;
    --ink: #14303B;
    --muted: #55707C;
    --line: #BCCDD4;
    --yolk: #F0AE0B;
    --yolk-ink: #2A1D00;
    --track: #CFDDE2;
    --alert: #C2410C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1E26; --panel: #172A34; --ink: #E6F0F3; --muted: #93AAB5;
      --line: #2B4452; --yolk: #F4B71C; --yolk-ink: #2A1D00; --track: #243A46; --alert: #FB923C;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  /* The 3D scene fills the whole screen, behind the UI. The egg can roll behind the title and the buttons. */
  #scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #scene canvas { width: 100%; height: 100%; display: block; }
  .app {
    position: relative; z-index: 1;
    height: 100dvh; max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 18px env(safe-area-inset-bottom, 0px);
  }
  header { padding-top: 14px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .sub { margin: 4px 0 0; font-size: .9rem; color: var(--muted); min-height: 1.2em; }

  /* The 3D scene */
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: .9rem; }
  #stage.ready .loading { display: none; }

  .panel { padding: 6px 0 18px; }
  fieldset { border: 0; padding: 0; margin: 0 0 12px; }
  legend { font-weight: 700; font-size: .9rem; margin-bottom: 6px; padding: 0; }
  .seg { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 8px 4px; border: 2px solid var(--line); border-radius: 14px; background: var(--panel);
    cursor: pointer; text-align: center; font-weight: 700; font-size: .92rem; min-height: 54px; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .seg label small { font-weight: 500; color: var(--muted); font-size: .72rem; }
  .seg input:checked + label { border-color: var(--yolk); background: var(--yolk); color: var(--yolk-ink); }
  .seg input:checked + label small { color: var(--yolk-ink); opacity: .8; }
  .seg input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 2px; }

  .alt-head { display: flex; justify-content: space-between; align-items: baseline; }
  .alt-head strong { font-size: .9rem; }
  .alt-head output { font-weight: 800; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--yolk); height: 30px; margin: 0; }
  .note { font-size: .78rem; color: var(--muted); margin: 2px 0 0; line-height: 1.35; }

  .actions { display: grid; gap: 10px; margin-top: 14px; }
  .panel button, .copybox button {
    font: inherit; font-weight: 800; font-size: 1.05rem; border: 0; border-radius: 16px; min-height: 56px; cursor: pointer;
    padding: 0 22px;
  }
  .panel button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .go { background: var(--yolk); color: var(--yolk-ink); }
  .stop { background: var(--panel); color: var(--ink); border: 2px solid var(--line); }
  .go.alarm { background: var(--alert); color: #fff; }
  .tip { margin: 10px 0 0; font-size: .82rem; color: var(--muted); text-align: center; }

  /* While the egg boils: hide the settings, give the egg the room */
  body.running .settings, body.done .settings { display: none; }

  .fps { position: fixed; left: 8px; top: calc(env(safe-area-inset-top, 0px) + 6px); font: 600 11px/1.2 ui-monospace, monospace; background: rgba(0,0,0,.6); color: #fff; padding: 3px 6px; border-radius: 6px; z-index: 9; pointer-events: none; }
  /* Lab (?lab) */
  .lil-gui.egglab { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); right: 4px; max-height: 75dvh; overflow-y: auto; z-index: 1000; }
  .copybox { position: fixed; inset: auto 12px calc(env(safe-area-inset-bottom, 0px) + 12px) 12px; z-index: 2000; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .copybox p { margin: 0 0 6px; font-weight: 700; font-size: .9rem; }
  .copybox textarea { width: 100%; height: 40dvh; font: 12px/1.3 ui-monospace, monospace; -webkit-user-select: text; user-select: text; }
  .copybox button { margin-top: 8px; min-height: 40px; width: 100%; background: var(--yolk); color: var(--yolk-ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="scene"></div>
<div class="app">
  <header>
    <h1>Eggklokke</h1>
    <p class="sub" id="sub">Start klokka når egget går ned i kokende vann.</p>
  </header>

  <div id="stage" aria-label="Egget, som du kan rulle rundt på skjermen">
    <div class="loading">Varmer opp vannet …</div>
  </div>
  <div class="sr-only" role="timer" id="srTime"></div>

  <div class="panel">
    <div class="settings">
      <fieldset>
        <legend>Hvordan vil du ha egget?</legend>
        <div class="seg">
          <input type="radio" name="d" id="d-soft" value="soft" checked><label for="d-soft">Bløtkokt<small>rennende plomme</small></label>
          <input type="radio" name="d" id="d-smile" value="smile"><label for="d-smile">Smilende<small>myk, kremet plomme</small></label>
          <input type="radio" name="d" id="d-hard" value="hard"><label for="d-hard">Hardkokt<small>fast plomme</small></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Størrelse</legend>
        <div class="seg">
          <input type="radio" name="s" id="s-s" value="s"><label for="s-s">Lite<small>under 53 g</small></label>
          <input type="radio" name="s" id="s-m" value="m" checked><label for="s-m">Medium<small>53–63 g</small></label>
          <input type="radio" name="s" id="s-l" value="l"><label for="s-l">Stort<small>over 63 g</small></label>
        </div>
      </fieldset>

      <div>
        <div class="alt-head"><strong><label for="alt">Høyde over havet</label></strong><output id="altOut" for="alt">0 m</output></div>
        <input type="range" id="alt" min="0" max="2500" step="50" value="0">
        <p class="note" id="altNote">Vannet koker ved 100 °C.</p>
      </div>
    </div>

    <div class="actions">
      <button class="go" id="go" type="button">Start</button>
      <button class="stop" id="reset" type="button" hidden>Avbryt</button>
    </div>
    <p class="tip" id="tip">Dra på skjermen for å rulle egget.</p>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
